
networks:
  searxng-net:
    driver: bridge

services:
  # 1. SearXNG Metasearch Engine

  searxng:
    image: docker.io/searxng/searxng:2026.7.26-b060c780d
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    networks:
      - searxng-net
    depends_on:
      - redis 

  # 2. Redis Cache (Improves SearXNG performance and avoids rate limits)
  redis:
    image: docker.io/valkey/valkey:8-alpine
    container_name: searxng-redis
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    networks:
      - searxng-net
